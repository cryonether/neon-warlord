[package]
name = "forward-renderer"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/FirePrincess01/neon-warlord"
description = "Basic pipeline using a forward rendering method (not deferred)"

[dependencies]
wgpu_renderer = { path = "../wgpu_renderer" }

# dependencies of wgpu 
cfg-if = "1"
env_logger = "0.11"
winit = "0.30"
wgpu = "30.0"
instant = "0.1"
cgmath = "0.18"

# other  
log = "0.4"
bytemuck = { version = "1.25", features = [ "derive" ] }
rusttype = "0.9"
gltf = "1.4.1"
colorous = "1.0.16"

[dependencies.image]
version = "0.25"
default-features = false
features = ["png", "jpeg"]
